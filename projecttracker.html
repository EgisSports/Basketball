<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: #e5e7eb;
}

.topbar {
  display: flex;
  overflow-x: auto;
  background: #0b1220;
  padding: 10px;
  gap: 10px;
  align-items: center;
}

.project-tab {
  background: #374151;
  border-radius: 6px;
  padding: 6px;
  min-width: 180px;
  display: flex;
}

.project-tab.active {
  background: #2563eb;
}

.project-tab input {
  width: 100%;
  border: none;
  background: transparent;
  color: white;
  text-align: center;
  font-size: 14px;
}

.new-project-btn {
  padding: 8px 12px;
  background: #10b981;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.delete-project-btn {
  padding: 8px 12px;
  background: #ef4444;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.container {
  padding: 20px;
  height: calc(100vh - 50px);
  overflow-y: auto;
}

.phase {
  background: #1f2937;
  margin-bottom: 15px;
  border-radius: 10px;
  padding: 15px;
}

.phase-title {
  font-size: 20px;
  font-weight: bold;
}

.section {
  border-top: 1px solid #374151;
  margin-top: 10px;
  padding-top: 10px;
}

.section-title {
  font-weight: bold;
  margin-bottom: 5px;
}

.task {
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  background: #2b3444;
}

.task-header {
  display: flex;
  justify-content: space-between;
}

.status-label {
  font-size: 11px;
  text-transform: uppercase;
}

.not-started { background: #2b3444; }
.in-progress { background: #1e3a8a; }
.blocked { background: #7f1d1d; }
.complete { background: #064e3b; }

textarea {
  width: 100%;
  margin-top: 6px;
  background: #111827;
  color: #e5e7eb;
  border: 1px solid #374151;
}
</style>
</head>

<body>

<div class="topbar" id="tabs"></div>

<div class="container">
  <h2 id="title"></h2>
  <div id="app"></div>
</div>

<script>

/* =========================
   STATUS
========================= */
const STATUSES = ["not-started","in-progress","blocked","complete"];

function nextStatus(s) {
  return STATUSES[(STATUSES.indexOf(s) + 1) % STATUSES.length];
}

/* =========================
   FULL MUNICIPAL WBS (RESTORED COMPLETE)
========================= */

const phasesTemplate = [

{
  name: "0 - Project Kickoff",
  sections: [
    {
      name: "Initiation & Coordination",
      tasks: [
        "Identify client PM and stakeholders",
        "Internal kickoff meeting (civil/process/structural/electrical)",
        "Define regulatory triggers (IDNR/IDEM/EPA/MS4)",
        "Confirm funding source (SRF/ARPA/bonds/capital budget)",
        "Review prior studies and master plans",
        "Establish communication matrix",
        "Prepare project initiation memo",
        "Define scope boundaries and exclusions",
        "Schedule kickoff meeting with client",
        "Document initial project risks"
      ]
    }
  ]
},

{
  name: "1 - Planning & Investigation",
  sections: [
    {
      name: "Data Collection",
      tasks: [
        "Collect GIS utility data",
        "Obtain as-built drawings",
        "Review O&M manuals and records",
        "Compile maintenance history",
        "Contact utility owners (gas/electric/telecom/fiber)",
        "Request IDEM SSO/CSO records",
        "Review CIP documents"
      ]
    },
    {
      name: "Field Investigations",
      tasks: [
        "CCTV sewer inspection",
        "Manhole inspections and defect coding",
        "Hydrant flow testing coordination",
        "Valve exercising coordination",
        "Pump station field inspection",
        "Flow monitoring setup (I/I study)",
        "Rainfall data correlation",
        "Outfall inspections",
        "Wet weather observations"
      ]
    },
    {
      name: "Hydraulic Modeling",
      tasks: [
        "Build SWMM/EPANET model",
        "Calibrate system model",
        "Baseline capacity analysis",
        "Surcharge and flooding analysis",
        "Infiltration/inflow source identification",
        "Scenario development"
      ]
    }
  ]
},

{
  name: "2 - Preliminary Design (30%)",
  sections: [
    {
      name: "Concept Development",
      tasks: [
        "Develop system alternatives",
        "Evaluate gravity vs pump systems",
        "Preliminary alignment selection",
        "Utility conflict screening",
        "Constructability review",
        "Preliminary cost estimating",
        "Prepare 30% design package"
      ]
    },
    {
      name: "Equipment & Vendor Coordination",
      tasks: [
        "Preliminary pump selection (duty point analysis)",
        "Contact pump manufacturers for budget pricing",
        "UV disinfection system preliminary sizing",
        "Blower/aeration system evaluation",
        "Packaged equipment vendor outreach",
        "Preliminary equipment layout coordination"
      ]
    }
  ]
},

{
  name: "3 - Detailed Design (60–90%)",
  sections: [
    {
      name: "Final Engineering Design",
      tasks: [
        "Finalize plan and profile drawings",
        "Pipe material and class selection",
        "Manhole structure design",
        "Utility conflict resolution",
        "Erosion and sediment control design",
        "Pump station final design",
        "Force main hydraulic/surge analysis",
        "Equipment specification development",
        "Coordinate vendor submittals",
        "Review manufacturer drawings"
      ]
    }
  ]
},

{
  name: "4 - Bid Phase",
  sections: [
    {
      name: "Contract Documents",
      tasks: [
        "Finalize construction plans and specs",
        "Engineer’s Opinion of Cost",
        "Prepare bid forms",
        "Pre-bid meeting coordination",
        "Issue addenda",
        "Respond to bidder questions",
        "Bid tabulation and recommendation"
      ]
    }
  ]
},

{
  name: "5 - Construction Administration",
  sections: [
    {
      name: "Field Services",
      tasks: [
        "Pre-construction meeting",
        "Submittal review and approval",
        "RFI responses",
        "Site visits and observation reports",
        "Pay application review",
        "Change order evaluation",
        "Construction testing oversight",
        "Utility coordination",
        "Progress documentation"
      ]
    }
  ]
},

{
  name: "6 - Project Closeout",
  sections: [
    {
      name: "Acceptance",
      tasks: [
        "Punch list walkthrough",
        "Final inspection",
        "Substantial completion certification",
        "Final pay application approval",
        "Operator training",
        "O&M manual turnover",
        "Warranty documentation"
      ]
    }
  ]
},

{
  name: "7 - Record Drawings",
  sections: [
    {
      name: "As-Built Documentation",
      tasks: [
        "Contractor redline compilation",
        "Field survey verification",
        "Final as-built drawings",
        "GIS database updates",
        "Asset registry updates",
        "Project archive submission"
      ]
    }
  ]
}

];

/* =========================
   STATE
========================= */

let store = JSON.parse(localStorage.getItem("store")) || {
  projects: {},
  activeProjectId: null,
  ui: { collapsed: {} }
};

function save() {
  localStorage.setItem("store", JSON.stringify(store));
}

/* =========================
   CREATE PROJECT
========================= */

function createProject(name) {
  const id = crypto.randomUUID();

  store.projects[id] = {
    id,
    name,
    phases: structuredClone(phasesTemplate).map(p => ({
      ...p,
      sections: p.sections.map(s => ({
        ...s,
        tasks: s.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }))
  };

  store.activeProjectId = id;
  save();
  render();
}

/* INIT */
if (!store.projects || Object.keys(store.projects).length === 0) {
  createProject("Phase IIB Sewer Interceptor");
  createProject("Greenbank Pump Station");
}

if (!store.activeProjectId) {
  store.activeProjectId = Object.keys(store.projects)[0];
}

/* =========================
   DELETE PROJECT
========================= */

function deleteProject() {
  const p = store.projects[store.activeProjectId];
  if (!p) return;

  if (!confirm(`Delete "${p.name}"? This cannot be undone.`)) return;

  delete store.projects[store.activeProjectId];

  const keys = Object.keys(store.projects);
  store.activeProjectId = keys.length ? keys[0] : null;

  save();
  render();
}

/* =========================
   RENDER
========================= */

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  Object.values(store.projects).forEach(p => {

    const tab = document.createElement("div");
    tab.className = "project-tab" + (p.id === store.activeProjectId ? " active" : "");

    const input = document.createElement("input");
    input.value = p.name;

    input.onchange = e => {
      p.name = e.target.value;
      save();
    };

    tab.onclick = () => {
      store.activeProjectId = p.id;
      save();
      render();
    };

    tab.appendChild(input);
    el.appendChild(tab);
  });

  const newBtn = document.createElement("div");
  newBtn.className = "new-project-btn";
  newBtn.innerText = "+ New Project";
  newBtn.onclick = () => {
    const name = prompt("Project name:");
    if (name) createProject(name);
  };

  const delBtn = document.createElement("div");
  delBtn.className = "delete-project-btn";
  delBtn.innerText = "Delete Project";
  delBtn.onclick = deleteProject;

  el.appendChild(newBtn);
  el.appendChild(delBtn);
}

/* MAIN RENDER */
function render() {
  renderTabs();

  const project = store.projects[store.activeProjectId];

  document.getElementById("title").innerText =
    project ? project.name : "No Project Selected";

  const app = document.getElementById("app");
  app.innerHTML = "";

  if (!project) return;

  project.phases.forEach(phase => {

    const phaseDiv = document.createElement("div");
    phaseDiv.className = "phase";

    const title = document.createElement("div");
    title.className = "phase-title";
    title.innerText = phase.name;
    phaseDiv.appendChild(title);

    phase.sections.forEach(section => {

      const secDiv = document.createElement("div");

      const secTitle = document.createElement("div");
      secTitle.className = "section-title";
      secTitle.innerText = section.name;

      secDiv.appendChild(secTitle);

      section.tasks.forEach(task => {

        const div = document.createElement("div");
        div.className = "task " + task.status;

        div.onclick = () => {
          const order = STATUSES;
          task.status = order[(order.indexOf(task.status) + 1) % order.length];
          save();
          render();
        };

        const header = document.createElement("div");
        header.className = "task-header";

        const name = document.createElement("div");
        name.innerText = task.name;

        const status = document.createElement("div");
        status.className = "status-label";
        status.innerText = task.status;

        header.appendChild(name);
        header.appendChild(status);

        const notes = document.createElement("textarea");
        notes.value = task.notes;
        notes.oninput = e => {
          task.notes = e.target.value;
          save();
        };

        div.appendChild(header);
        div.appendChild(notes);
        secDiv.appendChild(div);
      });

      phaseDiv.appendChild(secDiv);
    });

    app.appendChild(phaseDiv);
  });
}

/* INIT */
render();

</script>

</body>
</html>
