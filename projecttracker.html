<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827; /* CHARCOAL BASE */
  color: #e5e7eb;
}

/* TOP BAR */
.topbar {
  display: flex;
  overflow-x: auto;
  background: #0b1220;
  padding: 10px;
  gap: 10px;
  white-space: nowrap;
}

.project-tab {
  padding: 8px 14px;
  background: #374151;
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
}

.project-tab.active {
  background: #2563eb;
}

/* FILTER BAR */
.filterbar {
  display: flex;
  gap: 10px;
  margin: 10px 0 20px 0;
}

.filter-btn {
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  background: #1f2937;
  font-size: 13px;
  color: #e5e7eb;
}

.filter-btn.active {
  background: #2563eb;
}

/* MAIN */
.container {
  padding: 20px;
  height: calc(100vh - 50px);
  overflow-y: auto;
}

.phase {
  background: #ffffff;
  color: #111827;
  margin-bottom: 15px;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.phase-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.section {
  border-top: 1px solid #e5e7eb;
  padding-top: 10px;
  margin-top: 10px;
}

.section-title {
  font-weight: bold;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
}

/* TASK */
.task {
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.15s ease;
}

.task:hover {
  filter: brightness(0.97);
}

.task-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.task-name {
  font-weight: bold;
}

.status-label {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  opacity: 0.8;
}

/* STATUS COLORS (HIGH CONTRAST ON WHITE CARDS) */
.not-started { background: #f3f4f6; }
.in-progress { background: #dbeafe; }
.blocked { background: #fee2e2; }
.complete { background: #d1fae5; }

textarea {
  width: 100%;
  margin-top: 6px;
  height: 55px;
  border-radius: 6px;
  border: 1px solid #d1d5db;
  padding: 6px;
  font-family: inherit;
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="topbar" id="projectTabs"></div>

<div class="container">
  <h2 id="projectTitle"></h2>
  <div class="filterbar" id="filters"></div>
  <div id="app"></div>
</div>

<script>

/* =========================
   STATUS SYSTEM
========================= */

const STATUSES = ["not-started","in-progress","blocked","complete"];

function nextStatus(current) {
  const i = STATUSES.indexOf(current);
  return STATUSES[(i + 1) % STATUSES.length];
}

/* =========================
   FILTER STATE
========================= */

let activeFilter = "all";

/* =========================
   UI STATE
========================= */

let uiState = JSON.parse(localStorage.getItem("uiState")) || {
  collapsed: {}
};

function saveUIState() {
  localStorage.setItem("uiState", JSON.stringify(uiState));
}

/* =========================
   HEAVILY EXPANDED MUNICIPAL WBS
========================= */

const phasesTemplate = [
{
  name: "0 - Project Initiation",
  sections: [
    {
      name: "Internal Setup & Client Engagement",
      tasks: [
        "Identify client PM (City Engineer / Utilities Director / Public Works Supervisor)",
        "Internal kickoff with discipline leads (civil, process, hydraulic, structural)",
        "Define regulatory triggers (IDNR, IDEM, EPA CSO/SSO, MS4)",
        "Request existing master plans and capital improvement plans",
        "Confirm funding source (SRF / ARPA / bond / local capital)",
        "Define scope boundaries and exclusions",
        "Prepare project initiation memo",
        "Establish communication matrix (who gets copied on what)",
        "Schedule client kickoff meeting",
        "Document risks (schedule, utility conflicts, ROW, permitting delays)"
      ]
    }
  ]
},

{
  name: "1 - Planning & Investigation",
  sections: [
    {
      name: "Data Collection & Coordination",
      tasks: [
        "Request GIS shapefiles from City/County GIS department",
        "Contact utility coordinators (gas, electric, telecom, fiber)",
        "Request as-built drawings from city archives",
        "Contact plant operators for operational issues/history",
        "Obtain SSO/CSO reports from IDEM (if applicable)",
        "Review prior engineering studies and feasibility reports",
        "Compile maintenance logs (cleaning, jetting, repairs)"
      ]
    },
    {
      name: "Field Investigations",
      tasks: [
        "Schedule CCTV contractor (sanitary sewer condition assessment)",
        "Coordinate traffic control permits with city engineering",
        "Manhole inspection forms + defect coding (NASSCO PACP if used)",
        "Hydrant flow testing coordination with fire department",
        "Valve exercising coordination with utility operations crew",
        "Pump station field inspection with operator present",
        "Wet weather flow monitoring deployment (loggers + rain gauge)",
        "Infiltration source identification during high groundwater events",
        "Stormwater outfall inspections"
      ]
    },
    {
      name: "Hydraulic Modeling & Analysis",
      tasks: [
        "Build baseline SWMM model (sanitary + storm as applicable)",
        "Import GIS network geometry into model",
        "Calibrate model using flow monitoring data",
        "Define design storm events (5yr / 10yr / 25yr / 100yr)",
        "Identify surcharge and flooding nodes",
        "Evaluate downstream capacity constraints",
        "Document assumptions in modeling memo",
        "Prepare alternatives modeling scenarios"
      ]
    }
  ]
},

{
  name: "2 - Preliminary Design (30%)",
  sections: [
    {
      name: "Concept Development & Alternatives",
      tasks: [
        "Develop at least 2–3 alternatives (repair / replace / reroute)",
        "Prepare conceptual exhibits for each alternative",
        "Evaluate constructability (bypass pumping, staging, access)",
        "Identify easement requirements early",
        "Coordinate with property owners if known conflicts exist",
        "Develop preliminary opinion of cost per alternative",
        "Prepare 30% design narrative report"
      ]
    },
    {
      name: "Preliminary Engineering Deliverables",
      tasks: [
        "Develop preliminary plan & profile sheets",
        "Define preliminary pipe sizes and slopes",
        "Establish preliminary HGL / EGL (hydraulic grade line)",
        "Pump station preliminary sizing (if applicable)",
        "Force main preliminary routing (if applicable)",
        "Draft erosion control concept (NPDES considerations)",
        "Submit 30% design package to client for review"
      ]
    }
  ]
},

{
  name: "3 - Detailed Design",
  sections: [
    {
      name: "Final Design Development",
      tasks: [
        "Finalize alignment and grading design",
        "Finalize manhole spacing and structure types",
        "Prepare detailed pipe schedules",
        "Finalize utility conflict resolution",
        "Coordinate relocations with utility owners",
        "Prepare full construction plan set (60–90%)",
        "Develop technical specifications (CSI format)",
        "Finalize erosion & sediment control plan"
      ]
    },
    {
      name: "Permitting Coordination",
      tasks: [
        "Submit IDEM construction permit (if applicable)",
        "Coordinate Section 401/404 wetlands permitting",
        "Coordinate railroad crossing permits",
        "Submit MS4 permit compliance documentation",
        "Respond to regulatory review comments",
        "Maintain permitting log with status tracking"
      ]
    }
  ]
},

{
  name: "4 - Bid Phase",
  sections: [
    {
      name: "Contract Documents & Bidding",
      tasks: [
        "Finalize contract drawings and technical specs",
        "Prepare engineer’s opinion of cost (EOC)",
        "Coordinate legal review of contract documents",
        "Prepare bid form and bid schedule",
        "Issue addenda during bidding period",
        "Conduct pre-bid meeting with contractors",
        "Respond to bidder RFIs",
        "Assist in bid tabulation and award recommendation"
      ]
    }
  ]
},

{
  name: "5 - Construction Administration",
  sections: [
    {
      name: "Field & Office Administration",
      tasks: [
        "Conduct pre-construction meeting",
        "Review contractor submittals and shop drawings",
        "Maintain RFI log and response tracking",
        "Perform construction observation/site visits",
        "Review pay applications (quantities + progress)",
        "Evaluate change orders (scope + cost justification)",
        "Coordinate utility conflicts during construction",
        "Review testing reports (pressure, compaction, leakage)",
        "Maintain construction photo documentation"
      ]
    }
  ]
},

{
  name: "6 - Closeout",
  sections: [
    {
      name: "Acceptance & Handover",
      tasks: [
        "Develop punch list with owner",
        "Verify corrections completed",
        "Final walkthrough with City/Owner",
        "Substantial completion certification",
        "Final pay application approval",
        "Operator training session",
        "Deliver O&M manuals and warranties",
        "Prepare closeout report"
      ]
    }
  ]
},

{
  name: "7 - Record Drawings",
  sections: [
    {
      name: "As-Built & Asset Management",
      tasks: [
        "Collect contractor redlines",
        "Perform field survey verification",
        "Update plan sheets with as-built conditions",
        "Update GIS asset database",
        "Assign asset IDs (manholes, pipes, valves)",
        "Submit final record drawings to City",
        "Archive project documentation"
      ]
    }
  ]
}
];

/* =========================
   PROJECT STATE
========================= */

const projectNames = ["Project 1","Project 2","Project 3","Project 4"];

let projects = JSON.parse(localStorage.getItem("projects")) || {};
let currentProject = projectNames[0];

projectNames.forEach(p => {
  if (!projects[p]) {
    projects[p] = structuredClone(phasesTemplate).map(phase => ({
      ...phase,
      sections: phase.sections.map(sec => ({
        ...sec,
        tasks: sec.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }));
  }
});

function save() {
  localStorage.setItem("projects", JSON.stringify(projects));
}

/* =========================
   FILTER UI
========================= */

function renderFilters() {
  const f = document.getElementById("filters");
  f.innerHTML = "";

  ["all", ...STATUSES].forEach(status => {
    const btn = document.createElement("div");
    btn.className = "filter-btn" + (activeFilter === status ? " active" : "");
    btn.innerText = status;
    btn.onclick = () => {
      activeFilter = status;
      render();
    };
    f.appendChild(btn);
  });
}

/* =========================
   TABS
========================= */

function renderTabs() {
  const tabs = document.getElementById("projectTabs");
  tabs.innerHTML = "";

  projectNames.forEach(p => {
    const div = document.createElement("div");
    div.className = "project-tab" + (p === currentProject ? " active" : "");
    div.innerText = p;
    div.onclick = () => {
      currentProject = p;
      render();
    };
    tabs.appendChild(div);
  });
}

/* =========================
   RENDER
========================= */

function render() {
  renderTabs();
  renderFilters();

  document.getElementById("projectTitle").innerText = currentProject;

  const app = document.getElementById("app");
  app.innerHTML = "";

  const project = projects[currentProject];

  project.forEach((phase, pIndex) => {

    const phaseDiv = document.createElement("div");
    phaseDiv.className = "phase";

    const title = document.createElement("div");
    title.className = "phase-title";
    title.innerText = phase.name;
    phaseDiv.appendChild(title);

    phase.sections.forEach((section, sIndex) => {

      const key = `${currentProject}-${pIndex}-${sIndex}`;

      const secDiv = document.createElement("div");

      const secTitle = document.createElement("div");
      secTitle.className = "section-title";

      const collapsed = uiState.collapsed[key];

      secTitle.innerHTML = `
        <span>${section.name}</span>
        <span>${collapsed ? "▸" : "▾"}</span>
      `;

      secTitle.onclick = () => {
        uiState.collapsed[key] = !uiState.collapsed[key];
        saveUIState();
        render();
      };

      secDiv.appendChild(secTitle);

      if (!collapsed) {

        section.tasks
          .filter(t => activeFilter === "all" || t.status === activeFilter)
          .forEach(task => {

          const taskDiv = document.createElement("div");
          taskDiv.className = "task " + task.status;

          taskDiv.onclick = () => {
            task.status = nextStatus(task.status);
            save();
            render();
          };

          const header = document.createElement("div");
          header.className = "task-header";

          const name = document.createElement("div");
          name.className = "task-name";
          name.innerText = task.name;

          const status = document.createElement("div");
          status.className = "status-label";
          status.innerText = task.status;

          header.appendChild(name);
          header.appendChild(status);

          const notes = document.createElement("textarea");
          notes.value = task.notes;
          notes.placeholder = "Notes / decisions / coordination updates...";
          notes.onclick = e => e.stopPropagation();
          notes.oninput = e => {
            task.notes = e.target.value;
            save();
          };

          taskDiv.appendChild(header);
          taskDiv.appendChild(notes);

          secDiv.appendChild(taskDiv);
        });
      }

      phaseDiv.appendChild(secDiv);
    });

    app.appendChild(phaseDiv);
  });

  save();
}

/* INIT */
render();

</script>

</body>
</html>
