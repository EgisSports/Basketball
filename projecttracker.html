<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
}

/* TOP BAR */
.topbar {
  display: flex;
  overflow-x: auto;
  background: #111827;
  color: white;
  padding: 10px;
  gap: 10px;
  white-space: nowrap;
}

.project-tab {
  padding: 8px 14px;
  background: #374151;
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
}

.project-tab.active {
  background: #2563eb;
}

/* FILTER BAR */
.filterbar {
  display: flex;
  gap: 10px;
  margin: 10px 0 20px 0;
}

.filter-btn {
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  background: #e5e7eb;
  font-size: 13px;
}

.filter-btn.active {
  background: #2563eb;
  color: white;
}

/* MAIN */
.container {
  padding: 20px;
  height: calc(100vh - 50px);
  overflow-y: auto;
}

.phase {
  background: white;
  margin-bottom: 15px;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.phase-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

/* SECTION */
.section {
  border-top: 1px solid #e5e7eb;
  padding-top: 10px;
  margin-top: 10px;
}

.section-title {
  font-weight: bold;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
}

/* TASK */
.task {
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.15s ease;
}

.task:hover {
  filter: brightness(0.97);
}

.task-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.task-name {
  font-weight: bold;
}

/* STATUS LABEL */
.status-label {
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

/* FULL BLOCK COLORS */
.not-started { background: #f3f4f6; }
.in-progress { background: #dbeafe; }
.blocked { background: #fee2e2; }
.complete { background: #d1fae5; }

textarea {
  width: 100%;
  margin-top: 5px;
  height: 50px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="topbar" id="projectTabs"></div>

<div class="container">
  <h2 id="projectTitle"></h2>

  <div class="filterbar" id="filters"></div>

  <div id="app"></div>
</div>

<script>

/* =========================
   STATUS SYSTEM
========================= */

const STATUSES = ["not-started","in-progress","blocked","complete"];

function nextStatus(current) {
  const i = STATUSES.indexOf(current);
  return STATUSES[(i + 1) % STATUSES.length];
}

/* =========================
   FILTER STATE
========================= */

let activeFilter = "all";

/* =========================
   UI STATE (COLLAPSE)
========================= */

let uiState = JSON.parse(localStorage.getItem("uiState")) || {
  collapsed: {}
};

function saveUIState() {
  localStorage.setItem("uiState", JSON.stringify(uiState));
}

/* =========================
   EXPANDED ENGINEERING WBS
========================= */

const phasesTemplate = [
{
  name: "0 - Project Initiation",
  sections: [
    {
      name: "Internal & Client Kickoff",
      tasks: [
        "Initial internal scoping discussion",
        "Define drivers (capacity, condition, compliance)",
        "Client kickoff meeting",
        "Funding source identification",
        "Risk screening (schedule, constructability, utilities)",
        "Go / No-Go decision"
      ]
    }
  ]
},

{
  name: "1 - Planning & Investigation",
  sections: [
    {
      name: "Field & Data Collection",
      tasks: [
        "GIS utility compilation",
        "As-built drawing review",
        "CCTV inspection (sanitary defects, I/I)",
        "Manhole inspection",
        "Hydrant flow testing",
        "Pump station evaluation",
        "Rainfall / flow monitoring",
        "Water quality sampling"
      ]
    },
    {
      name: "Hydraulic Analysis",
      tasks: [
        "Develop SWMM / EPANET model",
        "Calibrate model",
        "Identify bottlenecks",
        "Evaluate I/I sources",
        "Flood risk mapping"
      ]
    }
  ]
},

{
  name: "2 - Preliminary Design",
  sections: [
    {
      name: "Concept Development",
      tasks: [
        "Develop alternatives",
        "Evaluate gravity vs pumped systems",
        "Preliminary alignment selection",
        "Utility conflict screening",
        "Preliminary constructability review"
      ]
    }
  ]
}
];

/* =========================
   PROJECT STATE
========================= */

const projectNames = [
"Project 1","Project 2","Project 3","Project 4"
];

let projects = JSON.parse(localStorage.getItem("projects")) || {};
let currentProject = projectNames[0];

projectNames.forEach(p => {
  if (!projects[p]) {
    projects[p] = structuredClone(phasesTemplate).map(phase => ({
      ...phase,
      sections: phase.sections.map(sec => ({
        ...sec,
        tasks: sec.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }));
  }
});

function save() {
  localStorage.setItem("projects", JSON.stringify(projects));
}

/* =========================
   FILTER UI
========================= */

function renderFilters() {
  const f = document.getElementById("filters");
  f.innerHTML = "";

  ["all", ...STATUSES].forEach(status => {
    const btn = document.createElement("div");
    btn.className = "filter-btn" + (activeFilter === status ? " active" : "");
    btn.innerText = status;
    btn.onclick = () => {
      activeFilter = status;
      render();
    };
    f.appendChild(btn);
  });
}

/* =========================
   TABS
========================= */

function renderTabs() {
  const tabs = document.getElementById("projectTabs");
  tabs.innerHTML = "";

  projectNames.forEach(p => {
    const div = document.createElement("div");
    div.className = "project-tab" + (p === currentProject ? " active" : "");
    div.innerText = p;
    div.onclick = () => {
      currentProject = p;
      render();
    };
    tabs.appendChild(div);
  });
}

/* =========================
   RENDER
========================= */

function render() {
  renderTabs();
  renderFilters();

  document.getElementById("projectTitle").innerText = currentProject;

  const app = document.getElementById("app");
  app.innerHTML = "";

  const project = projects[currentProject];

  project.forEach((phase, pIndex) => {

    const phaseDiv = document.createElement("div");
    phaseDiv.className = "phase";

    const title = document.createElement("div");
    title.className = "phase-title";
    title.innerText = phase.name;
    phaseDiv.appendChild(title);

    phase.sections.forEach((section, sIndex) => {

      const key = `${currentProject}-${pIndex}-${sIndex}`;

      const secDiv = document.createElement("div");
      secDiv.className = "section";

      const secTitle = document.createElement("div");
      secTitle.className = "section-title";

      const isCollapsed = uiState.collapsed[key];

      secTitle.innerHTML = `
        <span>${section.name}</span>
        <span>${isCollapsed ? "▸" : "▾"}</span>
      `;

      secTitle.onclick = () => {
        uiState.collapsed[key] = !uiState.collapsed[key];
        saveUIState();
        render();
      };

      secDiv.appendChild(secTitle);

      if (!isCollapsed) {

        section.tasks
          .filter(t => activeFilter === "all" || t.status === activeFilter)
          .forEach(task => {

          const taskDiv = document.createElement("div");
          taskDiv.className = "task " + task.status;

          taskDiv.onclick = () => {
            task.status = nextStatus(task.status);
            save();
            render();
          };

          const header = document.createElement("div");
          header.className = "task-header";

          const name = document.createElement("div");
          name.className = "task-name";
          name.innerText = task.name;

          const status = document.createElement("div");
          status.className = "status-label";
          status.innerText = task.status.replace("-", " ");

          header.appendChild(name);
          header.appendChild(status);

          const notes = document.createElement("textarea");
          notes.value = task.notes;
          notes.placeholder = "Notes / updates...";
          notes.onclick = e => e.stopPropagation();
          notes.oninput = e => {
            task.notes = e.target.value;
            save();
          };

          taskDiv.appendChild(header);
          taskDiv.appendChild(notes);

          secDiv.appendChild(taskDiv);
        });
      }

      phaseDiv.appendChild(secDiv);
    });

    app.appendChild(phaseDiv);
  });

  save();
}

/* INIT */
render();

</script>

</body>
</html>
