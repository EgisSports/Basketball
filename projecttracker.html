<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: #e5e7eb;
}

/* TOP BAR */
.topbar {
  display: flex;
  overflow-x: auto;
  background: #0b1220;
  padding: 10px;
  gap: 10px;
  white-space: nowrap;
}

.project-tab {
  padding: 8px 14px;
  background: #374151;
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
  min-width: 120px;
  text-align: center;
}

.project-tab.active {
  background: #2563eb;
}

/* FILTER BAR */
.filterbar {
  display: flex;
  gap: 10px;
  margin: 10px 0 20px 0;
}

.filter-btn {
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  background: #1f2937;
  font-size: 13px;
  color: #e5e7eb;
}

.filter-btn.active {
  background: #2563eb;
}

/* MAIN */
.container {
  padding: 20px;
  height: calc(100vh - 50px);
  overflow-y: auto;
}

/* PHASE CARD */
.phase {
  background: #1f2937; /* slightly lighter than page */
  color: #e5e7eb;
  margin-bottom: 15px;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.phase-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

/* SECTION */
.section {
  border-top: 1px solid #374151;
  padding-top: 10px;
  margin-top: 10px;
}

.section-title {
  font-weight: bold;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
}

/* TASK */
.task {
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.15s ease;
}

.task:hover {
  filter: brightness(1.08);
}

.task-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.task-name {
  font-weight: bold;
}

.status-label {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  opacity: 0.85;
}

/* STATUS COLORS */
.not-started { background: #2a2f3a; }
.in-progress { background: #1e3a8a; }
.blocked { background: #7f1d1d; }
.complete { background: #064e3b; }

textarea {
  width: 100%;
  margin-top: 6px;
  height: 55px;
  border-radius: 6px;
  border: 1px solid #374151;
  padding: 6px;
  font-family: inherit;
  background: #111827;
  color: #e5e7eb;
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="topbar" id="projectTabs"></div>

<div class="container">
  <h2 id="projectTitle"></h2>
  <div class="filterbar" id="filters"></div>
  <div id="app"></div>
</div>

<script>

/* =========================
   STATUS SYSTEM
========================= */

const STATUSES = ["not-started","in-progress","blocked","complete"];

function nextStatus(current) {
  const i = STATUSES.indexOf(current);
  return STATUSES[(i + 1) % STATUSES.length];
}

/* =========================
   FILTER STATE
========================= */

let activeFilter = "all";

/* =========================
   UI STATE
========================= */

let uiState = JSON.parse(localStorage.getItem("uiState")) || {
  collapsed: {}
};

function saveUIState() {
  localStorage.setItem("uiState", JSON.stringify(uiState));
}

/* =========================
   PROJECT NAMES (editable)
========================= */

let projectNames = JSON.parse(localStorage.getItem("projectNames")) || [
  "Project 1","Project 2","Project 3","Project 4"
];

function saveProjectNames() {
  localStorage.setItem("projectNames", JSON.stringify(projectNames));
}

/* =========================
   EXPANDED WBS (UPDATED LABEL)
========================= */

const phasesTemplate = [
{
  name: "0 - Project Kickoff",
  sections: [
    {
      name: "Internal Setup & Client Engagement",
      tasks: [
        "Identify client PM (City Engineer / Utilities Director / Public Works Supervisor)",
        "Internal kickoff with discipline leads (civil, process, hydraulic)",
        "Define regulatory triggers (IDNR, IDEM, EPA, MS4)",
        "Request existing master plans and CIP documents",
        "Confirm funding source (SRF / ARPA / bond / capital budget)",
        "Define scope boundaries and exclusions",
        "Prepare project initiation memo",
        "Establish communication matrix (distribution list)",
        "Schedule kickoff meeting with client",
        "Document project risks (utility conflicts, ROW, permitting delays)"
      ]
    }
  ]
},

{
  name: "1 - Planning & Investigation",
  sections: [
    {
      name: "Field & Data Collection",
      tasks: [
        "Request GIS data from City/County GIS department",
        "Contact utility locators (gas/electric/telecom/fiber)",
        "Retrieve as-built drawings from archives",
        "Contact plant operators for system history",
        "Obtain IDEM SSO/CSO records (if applicable)",
        "Review maintenance logs (jetting, repairs, failures)"
      ]
    },
    {
      name: "Field Investigations",
      tasks: [
        "Schedule CCTV inspection contractor",
        "Traffic control permitting coordination",
        "Manhole inspection + defect coding",
        "Hydrant flow testing coordination with fire department",
        "Valve exercising coordination with utility crew",
        "Pump station inspection with operator",
        "Flow monitoring deployment (I/I study)",
        "Wet weather infiltration observation",
        "Stormwater outfall inspections"
      ]
    }
  ]
}
];

/* =========================
   STATE
========================= */

let projects = JSON.parse(localStorage.getItem("projects")) || {};
let currentProject = projectNames[0];

projectNames.forEach(p => {
  if (!projects[p]) {
    projects[p] = structuredClone(phasesTemplate).map(phase => ({
      ...phase,
      sections: phase.sections.map(sec => ({
        ...sec,
        tasks: sec.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }));
  }
});

function save() {
  localStorage.setItem("projects", JSON.stringify(projects));
}

/* =========================
   FILTERS
========================= */

function renderFilters() {
  const f = document.getElementById("filters");
  f.innerHTML = "";

  ["all", ...STATUSES].forEach(status => {
    const btn = document.createElement("div");
    btn.className = "filter-btn" + (activeFilter === status ? " active" : "");
    btn.innerText = status;
    btn.onclick = () => {
      activeFilter = status;
      render();
    };
    f.appendChild(btn);
  });
}

/* =========================
   PROJECT TABS (EDITABLE)
========================= */

function renderTabs() {
  const tabs = document.getElementById("projectTabs");
  tabs.innerHTML = "";

  projectNames.forEach((p, index) => {

    const div = document.createElement("div");
    div.className = "project-tab" + (p === currentProject ? " active" : "");

    const input = document.createElement("input");
    input.value = p;
    input.style.width = "100%";
    input.style.background = "transparent";
    input.style.border = "none";
    input.style.color = "white";
    input.style.textAlign = "center";
    input.style.fontSize = "14px";

    input.onfocus = () => div.classList.add("active");

    input.onchange = (e) => {
      projectNames[index] = e.target.value;
      saveProjectNames();
    };

    div.onclick = () => {
      currentProject = projectNames[index];
      render();
    };

    div.appendChild(input);
    tabs.appendChild(div);
  });
}

/* =========================
   RENDER
========================= */

function render() {
  renderTabs();
  renderFilters();

  document.getElementById("projectTitle").innerText = currentProject;

  const app = document.getElementById("app");
  app.innerHTML = "";

  const project = projects[currentProject];

  project.forEach((phase, pIndex) => {

    const phaseDiv = document.createElement("div");
    phaseDiv.className = "phase";

    const title = document.createElement("div");
    title.className = "phase-title";
    title.innerText = phase.name;
    phaseDiv.appendChild(title);

    phase.sections.forEach((section, sIndex) => {

      const key = `${currentProject}-${pIndex}-${sIndex}`;

      const secDiv = document.createElement("div");
      const secTitle = document.createElement("div");
      secTitle.className = "section-title";

      const collapsed = uiState.collapsed[key];

      secTitle.innerHTML = `
        <span>${section.name}</span>
        <span>${collapsed ? "▸" : "▾"}</span>
      `;

      secTitle.onclick = () => {
        uiState.collapsed[key] = !uiState.collapsed[key];
        saveUIState();
        render();
      };

      secDiv.appendChild(secTitle);

      if (!collapsed) {

        section.tasks
          .filter(t => activeFilter === "all" || t.status === activeFilter)
          .forEach(task => {

          const taskDiv = document.createElement("div");
          taskDiv.className = "task " + task.status;

          taskDiv.onclick = () => {
            task.status = nextStatus(task.status);
            save();
            render();
          };

          const header = document.createElement("div");
          header.className = "task-header";

          const name = document.createElement("div");
          name.className = "task-name";
          name.innerText = task.name;

          const status = document.createElement("div");
          status.className = "status-label";
          status.innerText = task.status;

          header.appendChild(name);
          header.appendChild(status);

          const notes = document.createElement("textarea");
          notes.value = task.notes;
          notes.placeholder = "Notes / coordination / decisions...";
          notes.onclick = e => e.stopPropagation();
          notes.oninput = e => {
            task.notes = e.target.value;
            save();
          };

          taskDiv.appendChild(header);
          taskDiv.appendChild(notes);

          secDiv.appendChild(taskDiv);
        });
      }

      phaseDiv.appendChild(secDiv);
    });

    app.appendChild(phaseDiv);
  });

  save();
}

/* INIT */
render();

</script>

</body>
</html>
