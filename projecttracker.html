<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111827;
  color: #e5e7eb;
}

/* TOP BAR */
.topbar {
  display: flex;
  overflow-x: auto;
  background: #0b1220;
  padding: 10px;
  gap: 10px;
  align-items: center;
}

/* FIX: NO INPUTS, NO TEXTBOXES */
.project-tab {
  background: #374151;
  border-radius: 6px;
  padding: 8px 10px;
  min-width: 180px;
  cursor: pointer;

  user-select: none;
}

.project-tab.active {
  background: #2563eb;
}

.project-tab.editing {
  background: #1e3a8a;
}

.new-project-btn,
.delete-project-btn {
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.new-project-btn { background: #10b981; }
.delete-project-btn { background: #ef4444; }

/* MAIN */
.container {
  padding: 20px;
}

.phase {
  background: #1f2937;
  margin-bottom: 15px;
  padding: 15px;
  border-radius: 10px;
}

.section {
  margin-top: 10px;
}

.task {
  margin-top: 8px;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  background: #2b3444;
}

.task-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.status-label {
  font-size: 11px;
  opacity: 0.8;
  text-transform: uppercase;
}

/* STATUS COLORS */
.not-started { background: #2b3444; }
.in-progress { background: #1e3a8a; }
.blocked { background: #7f1d1d; }
.complete { background: #064e3b; }

textarea {
  width: 100%;
  margin-top: 5px;
  background: #111827;
  color: white;
  border: 1px solid #374151;
}
</style>
</head>

<body>

<div class="topbar" id="tabs"></div>

<div class="container">
  <h2 id="title"></h2>
  <div id="app"></div>
</div>

<script>

/* =========================
   STATUS
========================= */

const STATUSES = ["not-started","in-progress","blocked","complete"];

function nextStatus(s) {
  return STATUSES[(STATUSES.indexOf(s)+1)%STATUSES.length];
}

/* =========================
   FULL WBS TEMPLATE (RESTORED)
========================= */

const phasesTemplate = [

{
  name: "0 - Project Kickoff",
  sections: [{
    name: "Initiation",
    tasks: [
      "Identify client PM and stakeholders",
      "Internal kickoff meeting",
      "Define scope and constraints",
      "Confirm funding source",
      "Review prior studies",
      "Establish communication matrix",
      "Document risks"
    ]
  }]
},

{
  name: "1 - Planning & Investigation",
  sections: [{
    name: "Data Collection",
    tasks: [
      "Collect GIS utility data",
      "Obtain as-builts",
      "Review O&M records",
      "Contact utility owners",
      "Review regulatory history",
      "Field inspection coordination"
    ]
  },{
    name: "Field Investigations",
    tasks: [
      "CCTV inspection",
      "Manhole inspection",
      "Hydrant flow testing",
      "Pump station evaluation",
      "Flow monitoring",
      "Rainfall correlation",
      "Outfall inspection"
    ]
  },{
    name: "Hydraulic Modeling",
    tasks: [
      "Build SWMM/EPANET model",
      "Model calibration",
      "Capacity analysis",
      "Surcharge identification",
      "I/I analysis"
    ]
  }]
},

{
  name: "2 - Preliminary Design",
  sections: [{
    name: "Concept Development",
    tasks: [
      "Develop alternatives",
      "Gravity vs pump evaluation",
      "Alignment selection",
      "Utility conflict review",
      "Cost estimating"
    ]
  },{
    name: "Equipment Selection",
    tasks: [
      "Pump selection",
      "Vendor coordination",
      "UV system evaluation",
      "Blower sizing",
      "Equipment layout"
    ]
  }]
},

{
  name: "3 - Detailed Design",
  sections: [{
    name: "Final Design",
    tasks: [
      "Final plans",
      "Specifications",
      "Manhole design",
      "Pipe selection",
      "Erosion control",
      "Pump station design",
      "Force main design",
      "Shop drawing review"
    ]
  }]
},

{
  name: "4 - Bid Phase",
  sections: [{
    name: "Bidding",
    tasks: [
      "Final bid package",
      "Advertise project",
      "Pre-bid meeting",
      "Answer bidder questions",
      "Bid tabulation"
    ]
  }]
},

{
  name: "5 - Construction Administration",
  sections: [{
    name: "Field Services",
    tasks: [
      "Submittals",
      "RFIs",
      "Site visits",
      "Pay apps",
      "Change orders",
      "Testing oversight"
    ]
  }]
},

{
  name: "6 - Closeout",
  sections: [{
    name: "Finalization",
    tasks: [
      "Punch list",
      "Final inspection",
      "Substantial completion",
      "O&M manuals",
      "Final pay app"
    ]
  }]
},

{
  name: "7 - Record Drawings",
  sections: [{
    name: "As-Builts",
    tasks: [
      "Contractor redlines",
      "Survey verification",
      "Final drawings",
      "GIS updates",
      "Project archive"
    ]
  }]
}

];

/* =========================
   STATE
========================= */

let store = JSON.parse(localStorage.getItem("store")) || {
  projects: {},
  active: null
};

function save() {
  localStorage.setItem("store", JSON.stringify(store));
}

/* =========================
   PROJECT BUILD
========================= */

function buildProject(name) {
  return {
    name,
    phases: structuredClone(phasesTemplate).map(p => ({
      ...p,
      sections: p.sections.map(s => ({
        ...s,
        tasks: s.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }))
  };
}

/* INIT */
if (Object.keys(store.projects).length === 0) {
  const id = crypto.randomUUID();
  store.projects[id] = buildProject("New Project");
  store.active = id;
}

if (!store.active) {
  store.active = Object.keys(store.projects)[0];
}

/* =========================
   PROJECT MGMT
========================= */

function createProject() {
  const name = prompt("Project name:");
  if (!name) return;

  const id = crypto.randomUUID();
  store.projects[id] = buildProject(name);
  store.active = id;

  save();
  render();
}

function deleteProject() {
  const p = store.projects[store.active];
  if (!p) return;

  if (!confirm(`Delete "${p.name}"?`)) return;

  delete store.projects[store.active];
  store.active = Object.keys(store.projects)[0] || null;

  save();
  render();
}

/* =========================
   TAB RENDER (NO INPUTS)
========================= */

let editId = null;

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  Object.entries(store.projects).forEach(([id,p]) => {

    const tab = document.createElement("div");
    tab.className = "project-tab" + (id === store.active ? " active" : "");

    if (editId === id) {
      const input = document.createElement("input");
      input.value = p.name;

      input.onblur = () => {
        p.name = input.value;
        editId = null;
        save();
        render();
      };

      input.onkeydown = e => {
        if (e.key === "Enter") input.blur();
      };

      tab.appendChild(input);
      setTimeout(() => input.focus(), 0);

    } else {
      tab.innerText = p.name;

      tab.onclick = () => {
        store.active = id;
        render();
      };

      tab.ondblclick = () => {
        editId = id;
        render();
      };
    }

    el.appendChild(tab);
  });

  const add = document.createElement("div");
  add.className = "new-project-btn";
  add.innerText = "+ New Project";
  add.onclick = createProject;

  const del = document.createElement("div");
  del.className = "delete-project-btn";
  del.innerText = "Delete";
  del.onclick = deleteProject;

  el.appendChild(add);
  el.appendChild(del);
}

/* =========================
   MAIN RENDER
========================= */

function render() {
  renderTabs();

  const project = store.projects[store.active];
  document.getElementById("title").innerText = project.name;

  const app = document.getElementById("app");
  app.innerHTML = "";

  project.phases.forEach(phase => {

    const ph = document.createElement("div");
    ph.className = "phase";
    ph.innerHTML = `<b>${phase.name}</b>`;

    phase.sections.forEach(sec => {

      const s = document.createElement("div");
      s.className = "section";
      s.innerHTML = `<b>${sec.name}</b>`;

      sec.tasks.forEach(task => {

        const t = document.createElement("div");
        t.className = "task " + task.status;

        t.onclick = () => {
          task.status = nextStatus(task.status);
          save();
          render();
        };

        const header = document.createElement("div");
        header.className = "task-header";

        const name = document.createElement("div");
        name.innerText = task.name;

        const status = document.createElement("div");
        status.className = "status-label";
        status.innerText = task.status;

        header.appendChild(name);
        header.appendChild(status);

        const notes = document.createElement("textarea");
        notes.value = task.notes;

        notes.onclick = e => e.stopPropagation();

        notes.oninput = e => {
          task.notes = e.target.value;
          save();
        };

        t.appendChild(header);
        t.appendChild(notes);

        s.appendChild(t);
      });

      ph.appendChild(s);
    });

    app.appendChild(ph);
  });
}

render();

</script>

</body>
</html>
