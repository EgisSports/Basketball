<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: #e5e7eb;
}

/* TOP BAR */
.topbar {
  display: flex;
  overflow-x: auto;
  background: #0b1220;
  padding: 10px;
  gap: 10px;
  align-items: center;
}

.project-tab {
  background: #374151;
  border-radius: 6px;
  padding: 6px;
  min-width: 170px;
  display: flex;
}

.project-tab.active {
  background: #2563eb;
}

.project-tab input {
  width: 100%;
  border: none;
  background: transparent;
  color: white;
  text-align: center;
  font-size: 14px;
}

.new-project-btn {
  padding: 8px 12px;
  background: #10b981;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  white-space: nowrap;
}

/* MAIN */
.container {
  padding: 20px;
  height: calc(100vh - 50px);
  overflow-y: auto;
}

.phase {
  background: #1f2937;
  margin-bottom: 15px;
  border-radius: 10px;
  padding: 15px;
}

.phase-title {
  font-size: 20px;
  font-weight: bold;
}

.section {
  border-top: 1px solid #374151;
  margin-top: 10px;
  padding-top: 10px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  cursor: pointer;
}

.task {
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  background: #2b3444;
}

.task-header {
  display: flex;
  justify-content: space-between;
}

.status-label {
  font-size: 11px;
  text-transform: uppercase;
}

/* STATUS COLORS */
.not-started { background: #2b3444; }
.in-progress { background: #1e3a8a; }
.blocked { background: #7f1d1d; }
.complete { background: #064e3b; }

textarea {
  width: 100%;
  margin-top: 6px;
  background: #111827;
  color: #e5e7eb;
  border: 1px solid #374151;
}
</style>
</head>

<body>

<div class="topbar" id="tabs"></div>

<div class="container">
  <h2 id="title"></h2>
  <div id="app"></div>
</div>

<script>

/* =========================
   STATUS
========================= */
const STATUSES = ["not-started","in-progress","blocked","complete"];

function nextStatus(s) {
  return STATUSES[(STATUSES.indexOf(s) + 1) % STATUSES.length];
}

/* =========================
   FULL MUNICIPAL WBS TEMPLATE (RESTORED + COMPLETE)
========================= */

const phasesTemplate = [
{
  name: "0 - Project Kickoff",
  sections: [
    {
      name: "Initiation & Coordination",
      tasks: [
        "Identify client PM and stakeholders",
        "Internal kickoff (civil, process, structural, electrical)",
        "Define regulatory triggers (IDNR, IDEM, EPA, MS4)",
        "Confirm funding source (SRF, ARPA, bond, capital)",
        "Review prior studies / master plans",
        "Prepare project initiation memo",
        "Establish communication matrix",
        "Define scope boundaries and exclusions",
        "Schedule kickoff meeting",
        "Document initial project risks"
      ]
    }
  ]
},

{
  name: "1 - Planning & Investigation",
  sections: [
    {
      name: "Data Collection",
      tasks: [
        "GIS utility compilation",
        "As-built drawing review",
        "O&M record review",
        "Maintenance history review",
        "Contact utility owners (gas/electric/telecom/fiber)",
        "Obtain IDEM SSO/CSO records"
      ]
    },
    {
      name: "Field Investigations",
      tasks: [
        "CCTV inspection (sanitary/storm)",
        "Manhole inspections",
        "Hydrant flow testing",
        "Valve exercising coordination",
        "Pump station evaluation",
        "Flow monitoring setup (I/I study)",
        "Rainfall correlation analysis",
        "Outfall inspections"
      ]
    },
    {
      name: "Hydraulic Analysis",
      tasks: [
        "Build SWMM/EPANET model",
        "Model calibration",
        "Baseline capacity analysis",
        "Surcharge/flooding identification",
        "Infiltration source evaluation",
        "Scenario development"
      ]
    }
  ]
},

{
  name: "2 - Preliminary Design (30%)",
  sections: [
    {
      name: "Concept Development",
      tasks: [
        "Develop alternatives (repair/replace/upsizing/reroute)",
        "Gravity vs pump evaluation",
        "Preliminary alignment selection",
        "Utility conflict screening",
        "Constructability review",
        "Preliminary cost estimates",
        "30% design package preparation"
      ]
    },
    {
      name: "Equipment Selection",
      tasks: [
        "Preliminary pump selection (curves/duty point)",
        "Contact pump vendors for budget pricing",
        "UV system preliminary sizing (if applicable)",
        "Blower/aeration equipment screening",
        "Evaluate packaged equipment vendors",
        "Preliminary equipment layout coordination"
      ]
    }
  ]
},

{
  name: "3 - Detailed Design",
  sections: [
    {
      name: "Final Engineering Design",
      tasks: [
        "Final alignment and grading",
        "Pipe schedule finalization",
        "Manhole design details",
        "Utility conflict resolution",
        "Erosion control design (NPDES)",
        "Pump station final design",
        "Force main surge analysis",
        "Equipment specifications",
        "Coordinate vendor submittals",
        "Review manufacturer drawings"
      ]
    }
  ]
},

{
  name: "4 - Bid Phase",
  sections: [
    {
      name: "Contract Documents",
      tasks: [
        "Final plans/specifications",
        "Engineer’s Opinion of Cost",
        "Bid form preparation",
        "Pre-bid meeting coordination",
        "Bid addenda preparation",
        "Bid RFI responses",
        "Bid tabulation and recommendation"
      ]
    }
  ]
},

{
  name: "5 - Construction Administration",
  sections: [
    {
      name: "Field Administration",
      tasks: [
        "Pre-construction meeting",
        "Submittal review",
        "RFI tracking",
        "Site visits",
        "Pay application review",
        "Change order evaluation",
        "Testing oversight",
        "Utility coordination",
        "Construction documentation"
      ]
    }
  ]
},

{
  name: "6 - Closeout",
  sections: [
    {
      name: "Acceptance",
      tasks: [
        "Punch list walkthrough",
        "Final inspections",
        "Substantial completion",
        "Final pay application",
        "Operator training",
        "O&M manuals delivery",
        "Warranty documentation"
      ]
    }
  ]
},

{
  name: "7 - Record Drawings",
  sections: [
    {
      name: "As-Builts",
      tasks: [
        "Contractor redlines",
        "Field survey verification",
        "Final as-built drawings",
        "GIS updates",
        "Asset registry updates",
        "Project archiving"
      ]
    }
  ]
}
];

/* =========================
   STATE
========================= */

let store = JSON.parse(localStorage.getItem("store")) || {
  projects: {},
  activeProjectId: null,
  ui: { collapsed: {} }
};

function save() {
  localStorage.setItem("store", JSON.stringify(store));
}

/* =========================
   CREATE PROJECT
========================= */

function createProject(name) {
  const id = crypto.randomUUID();

  store.projects[id] = {
    id,
    name,
    phases: structuredClone(phasesTemplate).map(p => ({
      ...p,
      sections: p.sections.map(s => ({
        ...s,
        tasks: s.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }))
  };

  store.activeProjectId = id;
  save();
  render();
}

/* init */
if (!store.projects || Object.keys(store.projects).length === 0) {
  createProject("Phase IIB Sewer Interceptor");
  createProject("Greenbank Pump Station");
}

/* ensure active */
if (!store.activeProjectId) {
  store.activeProjectId = Object.keys(store.projects)[0];
  save();
}

/* =========================
   RENDER TOP BAR
========================= */

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  Object.values(store.projects).forEach(p => {

    const tab = document.createElement("div");
    tab.className = "project-tab" + (p.id === store.activeProjectId ? " active" : "");

    const input = document.createElement("input");
    input.value = p.name;

    input.onchange = e => {
      p.name = e.target.value;
      save();
      render();
    };

    tab.onclick = () => {
      store.activeProjectId = p.id;
      save();
      render();
    };

    tab.appendChild(input);
    el.appendChild(tab);
  });

  const newBtn = document.createElement("div");
  newBtn.className = "new-project-btn";
  newBtn.innerText = "+ New Project";
  newBtn.onclick = () => {
    const name = prompt("Project name:");
    if (name) createProject(name);
  };

  el.appendChild(newBtn);
}

/* =========================
   RENDER APP
========================= */

function render() {
  renderTabs();

  const project = store.projects[store.activeProjectId];
  document.getElementById("title").innerText = project.name;

  const app = document.getElementById("app");
  app.innerHTML = "";

  project.phases.forEach((phase, pi) => {

    const phaseDiv = document.createElement("div");
    phaseDiv.className = "phase";

    const title = document.createElement("div");
    title.className = "phase-title";
    title.innerText = phase.name;
    phaseDiv.appendChild(title);

    phase.sections.forEach((sec, si) => {

      const key = `${project.id}-${pi}-${si}`;

      const secDiv = document.createElement("div");

      const secTitle = document.createElement("div");
      secTitle.className = "section-title";

      const collapsed = store.ui.collapsed[key];

      secTitle.innerHTML = `<span>${sec.name}</span><span>${collapsed ? "▸" : "▾"}</span>`;

      secTitle.onclick = () => {
        store.ui.collapsed[key] = !store.ui.collapsed[key];
        save();
        render();
      };

      secDiv.appendChild(secTitle);

      if (!collapsed) {
        sec.tasks.forEach(task => {

          const div = document.createElement("div");
          div.className = "task " + task.status;

          div.onclick = () => {
            task.status = nextStatus(task.status);
            save();
            render();
          };

          const header = document.createElement("div");
          header.className = "task-header";

          const name = document.createElement("div");
          name.innerText = task.name;

          const status = document.createElement("div");
          status.className = "status-label";
          status.innerText = task.status;

          header.appendChild(name);
          header.appendChild(status);

          const notes = document.createElement("textarea");
          notes.value = task.notes;
          notes.oninput = e => {
            task.notes = e.target.value;
            save();
          };

          div.appendChild(header);
          div.appendChild(notes);

          secDiv.appendChild(div);
        });
      }

      phaseDiv.appendChild(secDiv);
    });

    app.appendChild(phaseDiv);
  });
}

/* INIT */
render();

</script>

</body>
</html>
