<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111827;
  color: #e5e7eb;
}

.topbar {
  display: flex;
  background: #0b1220;
  padding: 10px;
  gap: 10px;
}

.project-tab {
  background: #374151;
  border-radius: 6px;
  padding: 6px;
  min-width: 180px;
}

.project-tab.active { background: #2563eb; }

.project-tab input {
  width: 100%;
  background: transparent;
  border: none;
  color: white;
  text-align: center;
}

.new-project-btn, .delete-project-btn {
  padding: 8px;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
}
.new-project-btn { background: #10b981; }
.delete-project-btn { background: #ef4444; }

.container { padding: 20px; }

.phase {
  background: #1f2937;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
}

.section { margin-top: 10px; }

.task {
  margin-top: 8px;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.not-started { background: #2b3444; }
.in-progress { background: #1e3a8a; }
.blocked { background: #7f1d1d; }
.complete { background: #064e3b; }

textarea {
  width: 100%;
  margin-top: 5px;
  background: #111827;
  color: white;
}
</style>
</head>

<body>

<div class="topbar" id="tabs"></div>

<div class="container">
  <h2 id="title"></h2>
  <div id="app"></div>
</div>

<script>

/* =========================
   VERSIONING
========================= */
const TEMPLATE_VERSION = 2;

/* =========================
   MASTER TEMPLATE (FULL)
========================= */
const phasesTemplate = [
{
  name: "0 - Project Kickoff",
  sections: [
    {
      name: "Initiation",
      tasks: [
        "Client contact",
        "Internal kickoff",
        "Define scope",
        "Confirm funding",
        "Review prior studies"
      ]
    }
  ]
},
{
  name: "1 - Planning & Investigation",
  sections: [
    {
      name: "Data Collection",
      tasks: [
        "Collect GIS",
        "Review as-builts",
        "Field inspection",
        "Hydraulic modeling"
      ]
    }
  ]
},
{
  name: "2 - Preliminary Design",
  sections: [
    {
      name: "Concept",
      tasks: [
        "Develop alternatives",
        "Alignment selection",
        "Cost estimate"
      ]
    }
  ]
},
{
  name: "3 - Detailed Design",
  sections: [
    {
      name: "Engineering",
      tasks: [
        "Final plans",
        "Specs",
        "Permitting"
      ]
    }
  ]
},
{
  name: "4 - Bid",
  sections: [
    {
      name: "Bidding",
      tasks: [
        "Advertise",
        "Pre-bid meeting",
        "Bid tabulation"
      ]
    }
  ]
},
{
  name: "5 - Construction",
  sections: [
    {
      name: "CA",
      tasks: [
        "Submittals",
        "RFIs",
        "Pay apps"
      ]
    }
  ]
},
{
  name: "6 - Closeout",
  sections: [
    {
      name: "Final",
      tasks: [
        "Punch list",
        "Final pay",
        "O&M"
      ]
    }
  ]
},
{
  name: "7 - Record Drawings",
  sections: [
    {
      name: "As-Built",
      tasks: [
        "Redlines",
        "Final drawings"
      ]
    }
  ]
}
];

/* =========================
   UTIL
========================= */

function deepClone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function buildProjectFromTemplate(name) {
  return {
    name,
    version: TEMPLATE_VERSION,
    phases: deepClone(phasesTemplate).map(p => ({
      ...p,
      sections: p.sections.map(s => ({
        ...s,
        tasks: s.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }))
  };
}

/* =========================
   MIGRATION
========================= */

function migrateProject(project) {
  if (!project.version || project.version < TEMPLATE_VERSION) {

    const fresh = buildProjectFromTemplate(project.name);

    // merge statuses where names match
    fresh.phases.forEach((phase, pi) => {
      const oldPhase = project.phases[pi];
      if (!oldPhase) return;

      phase.sections.forEach((sec, si) => {
        const oldSec = oldPhase.sections[si];
        if (!oldSec) return;

        sec.tasks.forEach(task => {
          const match = oldSec.tasks.find(t => t.name === task.name);
          if (match) {
            task.status = match.status;
            task.notes = match.notes;
          }
        });
      });
    });

    return fresh;
  }
  return project;
}

/* =========================
   STATE
========================= */

let store = JSON.parse(localStorage.getItem("store")) || {
  projects: {},
  active: null
};

/* MIGRATE ALL PROJECTS */
Object.keys(store.projects).forEach(k => {
  store.projects[k] = migrateProject(store.projects[k]);
});

function save() {
  localStorage.setItem("store", JSON.stringify(store));
}

/* =========================
   PROJECT MGMT
========================= */

function createProject(name) {
  const id = crypto.randomUUID();
  store.projects[id] = buildProjectFromTemplate(name);
  store.active = id;
  save();
  render();
}

function deleteProject() {
  const p = store.projects[store.active];
  if (!confirm(`Delete "${p.name}"?`)) return;

  delete store.projects[store.active];
  store.active = Object.keys(store.projects)[0] || null;
  save();
  render();
}

/* INIT */
if (Object.keys(store.projects).length === 0) {
  createProject("New Project");
}

if (!store.active) {
  store.active = Object.keys(store.projects)[0];
}

/* =========================
   UI
========================= */

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  Object.entries(store.projects).forEach(([id,p]) => {
    const tab = document.createElement("div");
    tab.className = "project-tab" + (id === store.active ? " active" : "");

    const input = document.createElement("input");
    input.value = p.name;
    input.onclick = e => e.stopPropagation();
    input.onchange = e => {
      p.name = e.target.value;
      save();
    };

    tab.onclick = () => {
      store.active = id;
      render();
    };

    tab.appendChild(input);
    el.appendChild(tab);
  });

  const add = document.createElement("div");
  add.className = "new-project-btn";
  add.innerText = "+ New";
  add.onclick = () => {
    const name = prompt("Project name:");
    if (name) createProject(name);
  };

  const del = document.createElement("div");
  del.className = "delete-project-btn";
  del.innerText = "Delete";
  del.onclick = deleteProject;

  el.appendChild(add);
  el.appendChild(del);
}

function render() {
  renderTabs();

  const p = store.projects[store.active];
  document.getElementById("title").innerText = p.name;

  const app = document.getElementById("app");
  app.innerHTML = "";

  p.phases.forEach(phase => {

    const ph = document.createElement("div");
    ph.className = "phase";

    ph.innerHTML = `<b>${phase.name}</b>`;

    phase.sections.forEach(sec => {

      const s = document.createElement("div");
      s.className = "section";
      s.innerHTML = `<b>${sec.name}</b>`;

      sec.tasks.forEach(task => {

        const t = document.createElement("div");
        t.className = "task " + task.status;

        t.onclick = () => {
          const order = ["not-started","in-progress","blocked","complete"];
          task.status = order[(order.indexOf(task.status)+1)%4];
          save();
          render();
        };

        const name = document.createElement("div");
        name.innerText = task.name;

        const notes = document.createElement("textarea");
        notes.value = task.notes;
        notes.onclick = e => e.stopPropagation();
        notes.oninput = e => {
          task.notes = e.target.value;
          save();
        };

        t.appendChild(name);
        t.appendChild(notes);
        s.appendChild(t);
      });

      ph.appendChild(s);
    });

    app.appendChild(ph);
  });
}

render();

</script>

</body>
</html>
