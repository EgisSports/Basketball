<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111827;
  color: #e5e7eb;
}

/* TOP BAR */
.topbar {
  display: flex;
  overflow-x: auto;
  background: #0b1220;
  padding: 10px;
  gap: 10px;
  align-items: center;
}

/* FIX: prevent text selection in project tabs */
.project-tab {
  background: #374151;
  border-radius: 6px;
  padding: 6px;
  min-width: 180px;

  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}

.project-tab.active {
  background: #2563eb;
}

/* allow input editing but not tab label selection outside input */
.project-tab input {
  width: 100%;
  background: transparent;
  border: none;
  color: white;
  text-align: center;
  user-select: text;
}

.new-project-btn,
.delete-project-btn {
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.new-project-btn { background: #10b981; }
.delete-project-btn { background: #ef4444; }

.container {
  padding: 20px;
}

.phase {
  background: #1f2937;
  margin-bottom: 15px;
  padding: 15px;
  border-radius: 10px;
}

.section {
  margin-top: 10px;
}

.task {
  margin-top: 8px;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  background: #2b3444;
}

.not-started { background: #2b3444; }
.in-progress { background: #1e3a8a; }
.blocked { background: #7f1d1d; }
.complete { background: #064e3b; }

textarea {
  width: 100%;
  margin-top: 5px;
  background: #111827;
  color: white;
  border: 1px solid #374151;
}
</style>
</head>

<body>

<div class="topbar" id="tabs"></div>

<div class="container">
  <h2 id="title"></h2>
  <div id="app"></div>
</div>

<script>

/* =========================
   STATUS
========================= */
const STATUSES = ["not-started","in-progress","blocked","complete"];

function nextStatus(s) {
  return STATUSES[(STATUSES.indexOf(s)+1)%STATUSES.length];
}

/* =========================
   FULL MUNICIPAL WBS (LOCKED AUTHORITY VERSION)
========================= */

const phasesTemplate = [

{
  name: "0 - Project Kickoff",
  sections: [
    {
      name: "Initiation & Coordination",
      tasks: [
        "Identify client PM and stakeholders",
        "Internal kickoff meeting (civil/process/structural/electrical)",
        "Define regulatory triggers (IDNR/IDEM/EPA/MS4)",
        "Confirm funding source (SRF/ARPA/bonds/capital)",
        "Review prior studies and master plans",
        "Establish communication matrix",
        "Prepare project initiation memo",
        "Define scope boundaries and exclusions",
        "Schedule kickoff meeting with client",
        "Document initial project risks"
      ]
    }
  ]
},

{
  name: "1 - Planning & Investigation",
  sections: [
    {
      name: "Data Collection",
      tasks: [
        "Collect GIS utility data",
        "Obtain as-built drawings",
        "Review O&M manuals and records",
        "Compile maintenance history",
        "Contact utility owners (gas/electric/telecom/fiber)",
        "Request IDEM SSO/CSO records",
        "Review CIP documents"
      ]
    },
    {
      name: "Field Investigations",
      tasks: [
        "CCTV sewer inspection",
        "Manhole inspections and defect coding",
        "Hydrant flow testing coordination",
        "Valve exercising coordination",
        "Pump station inspection",
        "Flow monitoring setup (I/I study)",
        "Rainfall correlation analysis",
        "Outfall inspections",
        "Wet weather field observations"
      ]
    },
    {
      name: "Hydraulic Modeling",
      tasks: [
        "Build SWMM/EPANET model",
        "Model calibration",
        "Baseline capacity analysis",
        "Surcharge/flooding identification",
        "I/I source analysis",
        "Scenario development"
      ]
    }
  ]
},

{
  name: "2 - Preliminary Design (30%)",
  sections: [
    {
      name: "Concept Development",
      tasks: [
        "Develop system alternatives",
        "Evaluate gravity vs pump solutions",
        "Preliminary alignment selection",
        "Utility conflict screening",
        "Constructability review",
        "Preliminary cost estimating",
        "Prepare 30% design package"
      ]
    },
    {
      name: "Equipment Selection",
      tasks: [
        "Preliminary pump selection (curves/duty point)",
        "Vendor outreach for budget pricing",
        "UV system preliminary sizing (if applicable)",
        "Blower/aeration evaluation",
        "Packaged system vendor coordination",
        "Preliminary equipment layouts"
      ]
    }
  ]
},

{
  name: "3 - Detailed Design (60–90%)",
  sections: [
    {
      name: "Final Engineering Design",
      tasks: [
        "Final plans and profiles",
        "Pipe material selection",
        "Manhole design",
        "Utility conflict resolution",
        "Erosion control design (NPDES)",
        "Pump station final design",
        "Force main surge analysis",
        "Equipment specifications",
        "Vendor submittal coordination",
        "Review shop drawings"
      ]
    }
  ]
},

{
  name: "4 - Bid Phase",
  sections: [
    {
      name: "Contract Documents",
      tasks: [
        "Final plans/specifications",
        "Engineer’s Opinion of Cost",
        "Bid form preparation",
        "Pre-bid meeting",
        "Addenda issuance",
        "Bidder RFI responses",
        "Bid tabulation"
      ]
    }
  ]
},

{
  name: "5 - Construction Administration",
  sections: [
    {
      name: "Field Services",
      tasks: [
        "Pre-construction meeting",
        "Submittal review",
        "RFI responses",
        "Site visits",
        "Pay application review",
        "Change orders",
        "Construction testing oversight",
        "Utility coordination",
        "Progress documentation"
      ]
    }
  ]
},

{
  name: "6 - Closeout",
  sections: [
    {
      name: "Acceptance",
      tasks: [
        "Punch list",
        "Final inspection",
        "Substantial completion",
        "Final pay application",
        "Operator training",
        "O&M manuals",
        "Warranty closeout"
      ]
    }
  ]
},

{
  name: "7 - Record Drawings",
  sections: [
    {
      name: "As-Built Documentation",
      tasks: [
        "Contractor redlines",
        "Field survey verification",
        "Final as-builts",
        "GIS updates",
        "Asset registry updates",
        "Project archive"
      ]
    }
  ]
}

];

/* =========================
   STATE
========================= */

let store = JSON.parse(localStorage.getItem("store")) || {
  projects: {},
  active: null
};

function save() {
  localStorage.setItem("store", JSON.stringify(store));
}

/* =========================
   BUILD PROJECT (ALWAYS FULL TEMPLATE)
========================= */

function buildProject(name) {
  return {
    name,
    phases: structuredClone(phasesTemplate).map(p => ({
      ...p,
      sections: p.sections.map(s => ({
        ...s,
        tasks: s.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }))
  };
}

/* INIT */
if (Object.keys(store.projects).length === 0) {
  const id = crypto.randomUUID();
  store.projects[id] = buildProject("New Project");
  store.active = id;
}

/* =========================
   PROJECT ACTIONS
========================= */

function createProject() {
  const name = prompt("Project name:");
  if (!name) return;

  const id = crypto.randomUUID();
  store.projects[id] = buildProject(name);
  store.active = id;
  save();
  render();
}

function deleteProject() {
  const p = store.projects[store.active];
  if (!p) return;

  if (!confirm(`Delete "${p.name}"?`)) return;

  delete store.projects[store.active];
  store.active = Object.keys(store.projects)[0] || null;
  save();
  render();
}

/* =========================
   UI
========================= */

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  Object.entries(store.projects).forEach(([id,p]) => {

    const tab = document.createElement("div");
    tab.className = "project-tab" + (id === store.active ? " active" : "");

    const input = document.createElement("input");
    input.value = p.name;

    input.onchange = e => {
      p.name = e.target.value;
      save();
    };

    tab.onclick = () => {
      store.active = id;
      render();
    };

    tab.appendChild(input);
    el.appendChild(tab);
  });

  const add = document.createElement("div");
  add.className = "new-project-btn";
  add.innerText = "+ New Project";
  add.onclick = createProject;

  const del = document.createElement("div");
  del.className = "delete-project-btn";
  del.innerText = "Delete Project";
  del.onclick = deleteProject;

  el.appendChild(add);
  el.appendChild(del);
}

function render() {
  renderTabs();

  const project = store.projects[store.active];
  document.getElementById("title").innerText = project.name;

  const app = document.getElementById("app");
  app.innerHTML = "";

  project.phases.forEach(phase => {

    const ph = document.createElement("div");
    ph.className = "phase";
    ph.innerHTML = `<b>${phase.name}</b>`;

    phase.sections.forEach(sec => {

      const s = document.createElement("div");
      s.className = "section";
      s.innerHTML = `<b>${sec.name}</b>`;

      sec.tasks.forEach(task => {

        const t = document.createElement("div");
        t.className = "task " + task.status;

        t.onclick = () => {
          task.status = nextStatus(task.status);
          save();
          render();
        };

        const name = document.createElement("div");
        name.innerText = task.name;

        const notes = document.createElement("textarea");
        notes.value = task.notes;

        notes.onclick = e => e.stopPropagation();
        notes.oninput = e => {
          task.notes = e.target.value;
          save();
        };

        t.appendChild(name);
        t.appendChild(notes);
        s.appendChild(t);
      });

      ph.appendChild(s);
    });

    app.appendChild(ph);
  });
}

render();

</script>

</body>
</html>
