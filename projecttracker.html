<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: #e5e7eb;
}

/* TOP BAR */
.topbar {
  display: flex;
  overflow-x: auto;
  background: #0b1220;
  padding: 10px;
  gap: 10px;
  align-items: center;
}

.project-tab {
  background: #374151;
  border-radius: 6px;
  padding: 6px;
  min-width: 170px;
  display: flex;
}

.project-tab.active {
  background: #2563eb;
}

.project-tab input {
  width: 100%;
  border: none;
  background: transparent;
  color: white;
  text-align: center;
  font-size: 14px;
}

/* BUTTONS */
.new-project-btn {
  padding: 8px 12px;
  background: #10b981;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  white-space: nowrap;
}

.delete-project-btn {
  padding: 8px 12px;
  background: #ef4444;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  white-space: nowrap;
}

/* MAIN */
.container {
  padding: 20px;
  height: calc(100vh - 50px);
  overflow-y: auto;
}

.phase {
  background: #1f2937;
  margin-bottom: 15px;
  border-radius: 10px;
  padding: 15px;
}

.phase-title {
  font-size: 20px;
  font-weight: bold;
}

.section {
  border-top: 1px solid #374151;
  margin-top: 10px;
  padding-top: 10px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  cursor: pointer;
}

.task {
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  background: #2b3444;
}

.task-header {
  display: flex;
  justify-content: space-between;
}

.status-label {
  font-size: 11px;
  text-transform: uppercase;
}

/* STATUS COLORS */
.not-started { background: #2b3444; }
.in-progress { background: #1e3a8a; }
.blocked { background: #7f1d1d; }
.complete { background: #064e3b; }

textarea {
  width: 100%;
  margin-top: 6px;
  background: #111827;
  color: #e5e7eb;
  border: 1px solid #374151;
}
</style>
</head>

<body>

<div class="topbar" id="tabs"></div>

<div class="container">
  <h2 id="title"></h2>
  <div id="app"></div>
</div>

<script>

/* =========================
   STATUS
========================= */
const STATUSES = ["not-started","in-progress","blocked","complete"];

function nextStatus(s) {
  return STATUSES[(STATUSES.indexOf(s) + 1) % STATUSES.length];
}

/* =========================
   TEMPLATE (UNCHANGED)
========================= */

const phasesTemplate = [
{
  name: "0 - Project Kickoff",
  sections: [
    {
      name: "Initiation & Coordination",
      tasks: [
        "Identify client PM",
        "Internal kickoff",
        "Define regulatory triggers",
        "Confirm funding source",
        "Prepare kickoff memo",
        "Establish communication matrix",
        "Document risks"
      ]
    }
  ]
}
];

/* =========================
   STATE
========================= */

let store = JSON.parse(localStorage.getItem("store")) || {
  projects: {},
  activeProjectId: null,
  ui: { collapsed: {} }
};

function save() {
  localStorage.setItem("store", JSON.stringify(store));
}

/* =========================
   CREATE PROJECT
========================= */

function createProject(name) {
  const id = crypto.randomUUID();

  store.projects[id] = {
    id,
    name,
    phases: structuredClone(phasesTemplate).map(p => ({
      ...p,
      sections: p.sections.map(s => ({
        ...s,
        tasks: s.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }))
  };

  store.activeProjectId = id;
  save();
  render();
}

/* init */
if (!store.projects || Object.keys(store.projects).length === 0) {
  createProject("Phase IIB Sewer Interceptor");
  createProject("Greenbank Pump Station");
}

if (!store.activeProjectId) {
  store.activeProjectId = Object.keys(store.projects)[0];
}

/* =========================
   DELETE PROJECT (NEW)
========================= */

function deleteCurrentProject() {
  const project = store.projects[store.activeProjectId];
  if (!project) return;

  const ok = confirm(`Delete project "${project.name}"? This cannot be undone.`);
  if (!ok) return;

  delete store.projects[store.activeProjectId];

  const remaining = Object.keys(store.projects);
  store.activeProjectId = remaining.length ? remaining[0] : null;

  save();
  render();
}

/* =========================
   TOP BAR
========================= */

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  Object.values(store.projects).forEach(p => {

    const tab = document.createElement("div");
    tab.className = "project-tab" + (p.id === store.activeProjectId ? " active" : "");

    const input = document.createElement("input");
    input.value = p.name;

    input.onchange = e => {
      p.name = e.target.value;
      save();
    };

    tab.onclick = () => {
      store.activeProjectId = p.id;
      save();
      render();
    };

    tab.appendChild(input);
    el.appendChild(tab);
  });

  const newBtn = document.createElement("div");
  newBtn.className = "new-project-btn";
  newBtn.innerText = "+ New Project";
  newBtn.onclick = () => {
    const name = prompt("Project name:");
    if (name) createProject(name);
  };

  const delBtn = document.createElement("div");
  delBtn.className = "delete-project-btn";
  delBtn.innerText = "Delete Project";
  delBtn.onclick = deleteCurrentProject;

  el.appendChild(newBtn);
  el.appendChild(delBtn);
}

/* =========================
   RENDER
========================= */

function render() {
  renderTabs();

  const project = store.projects[store.activeProjectId];

  if (!project) {
    document.getElementById("title").innerText = "No Project Selected";
    document.getElementById("app").innerHTML = "";
    return;
  }

  document.getElementById("title").innerText = project.name;

  const app = document.getElementById("app");
  app.innerHTML = "";

  project.phases.forEach(phase => {

    const phaseDiv = document.createElement("div");
    phaseDiv.className = "phase";

    const title = document.createElement("div");
    title.className = "phase-title";
    title.innerText = phase.name;
    phaseDiv.appendChild(title);

    phase.sections.forEach(section => {

      const secDiv = document.createElement("div");

      const secTitle = document.createElement("div");
      secTitle.className = "section-title";
      secTitle.innerText = section.name;

      secDiv.appendChild(secTitle);

      section.tasks.forEach(task => {

        const div = document.createElement("div");
        div.className = "task " + task.status;

        div.onclick = () => {
          task.status = nextStatus(task.status);
          save();
          render();
        };

        const header = document.createElement("div");
        header.className = "task-header";

        const name = document.createElement("div");
        name.innerText = task.name;

        const status = document.createElement("div");
        status.className = "status-label";
        status.innerText = task.status;

        header.appendChild(name);
        header.appendChild(status);

        const notes = document.createElement("textarea");
        notes.value = task.notes;
        notes.oninput = e => {
          task.notes = e.target.value;
          save();
        };

        div.appendChild(header);
        div.appendChild(notes);

        secDiv.appendChild(div);
      });

      phaseDiv.appendChild(secDiv);
    });

    app.appendChild(phaseDiv);
  });
}

/* INIT */
render();

</script>

</body>
</html>
