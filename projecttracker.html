<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Municipal Project Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
}

/* TOP BAR */
.topbar {
  display: flex;
  overflow-x: auto;
  background: #111827;
  color: white;
  padding: 10px;
  gap: 10px;
  white-space: nowrap;
}

.project-tab {
  padding: 8px 14px;
  background: #374151;
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
}

.project-tab.active {
  background: #2563eb;
}

/* MAIN */
.container {
  padding: 20px;
  height: calc(100vh - 50px);
  overflow-y: auto;
}

.phase {
  background: white;
  margin-bottom: 15px;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.phase-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.section {
  border-top: 1px solid #e5e7eb;
  padding-top: 10px;
  margin-top: 10px;
}

.section-title {
  font-weight: bold;
  cursor: pointer;
}

/* TASK */
.task {
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.15s ease;
}

.task:hover {
  filter: brightness(0.97);
}

.task-name {
  font-weight: bold;
}

textarea {
  width: 100%;
  margin-top: 5px;
  height: 50px;
}

/* FULL-BLOCK STATUS COLORS */
.not-started {
  background: #f3f4f6;
}

.in-progress {
  background: #dbeafe;
}

.blocked {
  background: #fee2e2;
}

.complete {
  background: #d1fae5;
}

small {
  color: #6b7280;
}
</style>
</head>

<body>

<div class="topbar" id="projectTabs"></div>
<div class="container">
  <h2 id="projectTitle"></h2>
  <div id="app"></div>
</div>

<script>

/* =========================
   STATUS MODEL
========================= */

const STATUSES = ["not-started","in-progress","blocked","complete"];

function nextStatus(current) {
  const i = STATUSES.indexOf(current);
  return STATUSES[(i + 1) % STATUSES.length];
}

/* =========================
   EXPANDED MUNICIPAL WBS
========================= */

const phasesTemplate = [
{
  name: "0 - Project Initiation",
  sections: [
    {
      name: "Internal & Client Kickoff",
      tasks: [
        "Initial internal scoping discussion",
        "Define project drivers (capacity, condition, compliance, growth)",
        "Client kickoff meeting",
        "Establish communication protocol",
        "Define regulatory framework (IDNR / IDEM / EPA / local)",
        "Confirm funding source (SRF, grant, bond, capital budget)",
        "Risk screening (schedule, constructability, utility conflicts)",
        "Go / No-Go decision"
      ]
    }
  ]
},

{
  name: "1 - Planning & Field Investigation",
  sections: [
    {
      name: "Existing System Review",
      tasks: [
        "Collect GIS base mapping and utility layers",
        "Review as-builts and record drawings",
        "Compile O&M records and historical failures",
        "Review CSO/SSO history if applicable",
        "Identify downstream/upstream system constraints"
      ]
    },
    {
      name: "Field Investigation",
      tasks: [
        "Site reconnaissance visit",
        "Sanitary CCTV inspection (defects, infiltration, roots)",
        "Storm sewer condition assessment",
        "Manhole inspection and depth verification",
        "Hydrant flow testing / fire flow analysis",
        "Water main valve exercising / field verification",
        "Pump station performance evaluation",
        "Wet weather flow monitoring setup",
        "Rainfall correlation analysis",
        "Sampling (I/I, water quality, effluent if needed)"
      ]
    },
    {
      name: "Hydraulic & System Analysis",
      tasks: [
        "Develop baseline hydraulic model (SWMM / EPANET)",
        "Calibrate model with field data",
        "Identify capacity constraints and surcharge points",
        "Evaluate infiltration/inflow contributions",
        "Identify flood risk and overflow points"
      ]
    }
  ]
},

{
  name: "2 - Preliminary Design (30%)",
  sections: [
    {
      name: "Concept Development",
      tasks: [
        "Develop alternative solutions (repair, replace, upsizing, reroute)",
        "Evaluate gravity vs pump alternatives",
        "Preliminary alignment and corridor selection",
        "Preliminary utility conflict mapping",
        "Constructability review (access, staging, bypass pumping)",
        "Permitting pathway identification"
      ]
    },
    {
      name: "Preliminary Engineering",
      tasks: [
        "Topographic survey coordination",
        "Geotechnical borings request",
        "Preliminary pipe sizing and slopes",
        "Preliminary hydraulic grade line development",
        "Pump station preliminary sizing (if applicable)",
        "Order of magnitude cost estimate",
        "30% plan set development"
      ]
    }
  ]
},

{
  name: "3 - Detailed Design (60–90%)",
  sections: [
    {
      name: "Final Engineering Design",
      tasks: [
        "Final horizontal and vertical alignment",
        "Detailed pipe network design",
        "Manhole structure design and spacing",
        "Easement and ROW determination",
        "Erosion control design (NPDES compliance)",
        "Pump station final design (if applicable)",
        "Force main surge analysis (if applicable)",
        "Final hydraulic model runs",
        "Technical specifications drafting"
      ]
    },
    {
      name: "Permitting & Coordination",
      tasks: [
        "IDNR/IDEA/IDE requirements review",
        "Section 401/404 coordination if wetlands involved",
        "Railroad/utility crossings coordination",
        "Local agency utility approvals",
        "Permit application submission",
        "Respond to regulatory comments"
      ]
    }
  ]
},

{
  name: "4 - Final Design / Bid Package",
  sections: [
    {
      name: "Contract Documents",
      tasks: [
        "Final QA/QC review of plans",
        "Final technical specifications",
        "Engineer’s Opinion of Probable Cost",
        "Bid schedule preparation",
        "Addenda preparation during bidding",
        "Bid advertisement support",
        "Pre-bid meeting coordination"
      ]
    }
  ]
},

{
  name: "5 - Construction Administration",
  sections: [
    {
      name: "Construction Oversight",
      tasks: [
        "Pre-construction meeting",
        "Shop drawing review",
        "RFI response tracking",
        "Submittal log maintenance",
        "Site visits and progress documentation",
        "Pay application review",
        "Change order evaluation",
        "Construction testing oversight (compaction, pressure tests, leakage)",
        "Utility coordination during construction",
        "Traffic control review"
      ]
    }
  ]
},

{
  name: "6 - Project Closeout",
  sections: [
    {
      name: "Final Acceptance",
      tasks: [
        "Punch list development and verification",
        "System startup and operational testing",
        "Final walkthrough with owner",
        "Substantial completion certification",
        "Final pay application approval",
        "Training for operator staff",
        "O&M manual delivery"
      ]
    }
  ]
},

{
  name: "7 - Record Drawings / Asset Handoff",
  sections: [
    {
      name: "As-Builts & GIS",
      tasks: [
        "Contractor redline collection",
        "Survey verification of installed utilities",
        "Final as-built plan preparation",
        "GIS database update",
        "Asset registry population",
        "Project archive and documentation closeout"
      ]
    }
  ]
}
];

/* =========================
   STATE
========================= */

const projectNames = [
"Project 1","Project 2","Project 3","Project 4",
"Project 5","Project 6","Project 7","Project 8"
];

let projects = JSON.parse(localStorage.getItem("projects")) || {};
let currentProject = projectNames[0];

projectNames.forEach(p => {
  if (!projects[p]) {
    projects[p] = structuredClone(phasesTemplate).map(phase => ({
      ...phase,
      sections: phase.sections.map(sec => ({
        ...sec,
        tasks: sec.tasks.map(t => ({
          name: t,
          status: "not-started",
          notes: ""
        }))
      }))
    }));
  }
});

function save() {
  localStorage.setItem("projects", JSON.stringify(projects));
}

/* =========================
   RENDER
========================= */

function renderTabs() {
  const tabs = document.getElementById("projectTabs");
  tabs.innerHTML = "";

  projectNames.forEach(p => {
    const div = document.createElement("div");
    div.className = "project-tab" + (p === currentProject ? " active" : "");
    div.innerText = p;
    div.onclick = () => {
      currentProject = p;
      render();
    };
    tabs.appendChild(div);
  });
}

function render() {
  renderTabs();
  document.getElementById("projectTitle").innerText = currentProject;

  const app = document.getElementById("app");
  app.innerHTML = "";

  const project = projects[currentProject];

  project.forEach((phase) => {
    const phaseDiv = document.createElement("div");
    phaseDiv.className = "phase";

    const title = document.createElement("div");
    title.className = "phase-title";
    title.innerText = phase.name;
    phaseDiv.appendChild(title);

    phase.sections.forEach(section => {
      const secDiv = document.createElement("div");
      secDiv.className = "section";

      const secTitle = document.createElement("div");
      secTitle.className = "section-title";
      secTitle.innerText = section.name;
      secDiv.appendChild(secTitle);

      section.tasks.forEach(task => {

        const taskDiv = document.createElement("div");
        taskDiv.className = "task " + task.status;

        taskDiv.onclick = () => {
          task.status = nextStatus(task.status);
          save();
          render();
        };

        const name = document.createElement("div");
        name.className = "task-name";
        name.innerText = task.name;

        const notes = document.createElement("textarea");
        notes.value = task.notes;
        notes.placeholder = "Notes / updates...";
        notes.onclick = (e) => e.stopPropagation();
        notes.oninput = (e) => {
          task.notes = e.target.value;
          save();
        };

        taskDiv.appendChild(name);
        taskDiv.appendChild(notes);

        secDiv.appendChild(taskDiv);
      });

      phaseDiv.appendChild(secDiv);
    });

    app.appendChild(phaseDiv);
  });

  save();
}

/* INIT */
render();

</script>

</body>
</html>
