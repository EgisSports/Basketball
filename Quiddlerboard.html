<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="trophy.png">
<meta charset="UTF-8" />
<title>Quiddlerboard</title>

<style>
  body {
    font-family: "Orbitron", sans-serif;
    background: radial-gradient(circle at center, #0b1020 0%, #000 100%);
    color: #fff;
    margin: 0;
    padding: 20px;
  }

  h1, h2, h3, h4 {
    text-shadow: 0 0 20px #00ffcc;
    letter-spacing: 1px;
  }

  .section {
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 0 25px rgba(0,255,204,0.25);
    backdrop-filter: blur(10px);
  }

  input, select, button {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: none;
    padding: 8px;
    border-radius: 8px;
    font-size: 0.9rem;
  }

  button {
    cursor: pointer;
    background: linear-gradient(90deg, #00ffcc, #00bfff);
    color: #000;
    font-weight: bold;
    box-shadow: 0 0 15px #00ffcc;
    transition: 0.3s;
  }

  button:hover {
    box-shadow: 0 0 25px #00ffcc;
    transform: scale(1.05);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 10px;
    text-align: left;
  }

  th {
    background: rgba(0,255,204,0.2);
    color: #00ffcc;
    text-shadow: 0 0 10px #00ffcc;
    cursor: pointer;
  }

  tr:nth-child(even) {
    background: rgba(255,255,255,0.05);
  }

  .flex-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .block {
    min-width: 220px;
    flex: 1;
  }

  .small {
    font-size: 0.8rem;
    opacity: 0.7;
  }

  #currentPlayersSelect {
    min-height: 140px;
  }

  .nav-switch {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
  }

  .nav-switch button {
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    background: linear-gradient(90deg, #00ffcc, #00bfff);
    color: #000;
    box-shadow: 0 0 15px #00ffcc;
    border: none;
    transition: 0.3s;
  }

  .nav-switch button:hover {
    box-shadow: 0 0 25px #00ffcc;
    transform: scale(1.05);
  }

  .nav-active {
    background:#00ffcc !important;
    color:#000 !important;
    box-shadow:0 0 25px #00ffcc !important;
  }
</style>
</head>

<body>

<div class="nav-switch">
  <button onclick="window.location.href='https://egissports.github.io/Basketball/'">🏀 Basketball</button>
  <button class="nav-active" onclick="window.location.href='Quiddlerboard.html'">🃏 Quiddlerboard</button>
</div>

<h1>🃏 Quiddlerboard</h1>

<div class="section">
  <h2>All‑Time Leaderboard</h2>

  <div class="flex-row">
    <div class="block">
      <h3>Add New Player</h3>
      <label>Player name</label>
      <input type="text" id="newPlayerName" placeholder="e.g. Drew" />
      <button id="addPlayerBtn">Add Player</button>
    </div>

    <div class="block">
      <h3>Add Game Score</h3>
      <label>Player</label>
      <select id="playerSelect"></select>

      <label>Score to add</label>
      <input type="number" id="scoreInput" placeholder="e.g. 42" />

      <button id="addScoreBtn">Add Score</button>
    </div>

    <div class="block">
      <h3>Sort & Data</h3>
      <button id="sortAscBtn">Sort Total Asc</button>
      <button id="sortDescBtn">Sort Total Desc</button>
      <hr />
      <button id="exportCsvBtn">Export CSV</button>
      <button id="importCsvBtn">Import CSV</button>
      <input type="file" id="importCsvInput" accept=".csv" style="display:none" />
      <hr />
      <h4>Remove Player</h4>
      <select id="removePlayerSelect"></select>
      <button id="removePlayerBtn">Remove Player</button>
    </div>
  </div>

  <table id="playersTable">
    <thead>
      <tr>
        <th data-sort-key="name">Player</th>
        <th data-sort-key="games">Games Played</th>
        <th data-sort-key="total">Total Points</th>
        <th>Scores</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="section">
  <h2>Current Game Tracker (8 Rounds)</h2>

  <div class="flex-row">
    <div class="block">
      <label>Select Players (Ctrl/Cmd+Click)</label>
      <select id="currentPlayersSelect" multiple></select>
    </div>

    <div class="block">
      <label>&nbsp;</label>
      <button id="startGameBtn">Start / Reset Game</button>
      <p class="small">Totals update live as you type.</p>
    </div>
  </div>

  <table id="currentGameTable">
    <thead>
      <tr>
        <th>Player</th>
        <th>R1</th><th>R2</th><th>R3</th><th>R4</th>
        <th>R5</th><th>R6</th><th>R7</th><th>R8</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
function loadPlayersFromStorage() {
  try {
    const raw = localStorage.getItem("quiddlerPlayers");
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return parsed.map(p => ({
      name: p.name || "",
      scores: Array.isArray(p.scores) ? p.scores.map(n => Number(n)||0) : []
    }));
  } catch {
    return [];
  }
}

let players = loadPlayersFromStorage();
function savePlayers() {
  localStorage.setItem("quiddlerPlayers", JSON.stringify(players));
}

const newPlayerNameInput = document.getElementById("newPlayerName");
const addPlayerBtn = document.getElementById("addPlayerBtn");
const playerSelect = document.getElementById("playerSelect");
const scoreInput = document.getElementById("scoreInput");
const addScoreBtn = document.getElementById("addScoreBtn");
const sortAscBtn = document.getElementById("sortAscBtn");
const sortDescBtn = document.getElementById("sortDescBtn");
const playersTableBody = document.querySelector("#playersTable tbody");
const tableHeaders = document.querySelectorAll("#playersTable th[data-sort-key]");

const exportCsvBtn = document.getElementById("exportCsvBtn");
const importCsvBtn = document.getElementById("importCsvBtn");
const importCsvInput = document.getElementById("importCsvInput");

const removePlayerSelect = document.getElementById("removePlayerSelect");
const removePlayerBtn = document.getElementById("removePlayerBtn");

const currentPlayersSelect = document.getElementById("currentPlayersSelect");
const startGameBtn = document.getElementById("startGameBtn");
const currentGameTableBody = document.querySelector("#currentGameTable tbody");

let currentSort = { key: "name", direction: "asc" };
let currentGame = { players: [] };

function renderPlayerSelects() {
  if (players.length === 0) {
    playerSelect.innerHTML = "";
    currentPlayersSelect.innerHTML = "";
    removePlayerSelect.innerHTML = "<option value='__none__'>-- No players --</option>";
    return;
  }

  const options = players
    .map((p,i)=>`<option value="${i}">${p.name}</option>`)
    .join("");

  playerSelect.innerHTML = options;
  currentPlayersSelect.innerHTML = options;

  removePlayerSelect.innerHTML = `
    <option value="__none__">-- Select player --</option>
    ${options}
  `;
}

function renderTable() {
  const sorted = [...players].sort((a,b)=>{
    if (currentSort.key === "name") {
      const A = a.name.toLowerCase();
      const B = b.name.toLowerCase();
      return currentSort.direction === "asc" ? A.localeCompare(B) : B.localeCompare(A);
    } else if (currentSort.key === "games") {
      const A = a.scores.length;
      const B = b.scores.length;
      return currentSort.direction === "asc" ? A - B : B - A;
    } else {
      const A = a.scores.reduce((s,n)=>s+n,0);
      const B = b.scores.reduce((s,n)=>s+n,0);
      return currentSort.direction === "asc" ? A - B : B - A;
    }
  });

  playersTableBody.innerHTML = sorted.map(p=>{
    const games = p.scores.length;
    const total = p.scores.reduce((s,n)=>s+n,0);
    return `
      <tr>
        <td>${p.name}</td>
        <td>${games}</td>
        <td>${total}</td>
        <td>${p.scores.join(", ")}</td>
      </tr>
    `;
  }).join("");
}

function addPlayer() {
  const name = newPlayerNameInput.value.trim();
  if (!name) return alert("Enter a name.");

  if (players.some(p=>p.name.toLowerCase()===name.toLowerCase()))
    return alert("Player already exists.");

  players.push({ name, scores: [] });
  savePlayers();
  newPlayerNameInput.value="";
  renderPlayerSelects();
  renderTable();
}

function removePlayer() {
  const val = removePlayerSelect.value;
  if (val === "__none__") return alert("Select a player.");

  const idx = Number(val);
  const name = players[idx].name;

  if (!confirm(`Remove ${name}?`)) return;

  players.splice(idx,1);
  savePlayers();

  currentGame.players = [];
  renderCurrentGameTable();

  renderPlayerSelects();
  renderTable();
}

function addScore() {
  const idx = Number(playerSelect.value);
  const val = Number(scoreInput.value);

  if (isNaN(idx)) return alert("Select a player.");
  if (isNaN(val)) return alert("Enter a score.");

  players[idx].scores.push(val);
  savePlayers();
  scoreInput.value="";
  renderTable();
}

function renderCurrentGameTable() {
  if (currentGame.players.length===0) {
    currentGameTableBody.innerHTML="";
    return;
  }

  currentGameTableBody.innerHTML = currentGame.players.map((cg,i)=>{
    const name = players[cg.playerIndex]?.name || "Unknown";
    const total = cg.rounds.reduce((s,n)=>s+(n||0),0);

    let row = `<tr data-row="${i}"><td>${name}</td>`;
    for (let r=0;r<8;r++) {
      row += `
        <td><input type="number" class="cgRoundInput"
          data-player="${i}" data-round="${r}"
          value="${cg.rounds[r] ?? ""}"></td>`;
    }
    row += `<td class="cgTotal">${total}</td></tr>`;
    return row;
  }).join("");

  document.querySelectorAll(".cgRoundInput").forEach(inp=>{
    inp.addEventListener("input", handleCurrentGameInput);
  });
}

function handleCurrentGameInput(e) {
  const row = Number(e.target.dataset.player);
  const round = Number(e.target.dataset.round);
  const val = e.target.value==="" ? null : Number(e.target.value);

  currentGame.players[row].rounds[round] = val;

  const total = currentGame.players[row].rounds.reduce((s,n)=>s+(n||0),0);
  document.querySelector(`tr[data-row="${row}"] .cgTotal`).textContent = total;
}

function startCurrentGame() {
  const selected = [...currentPlayersSelect.selectedOptions];
  if (selected.length===0) return alert("Select players.");

  currentGame.players = selected.map(opt=>({
    playerIndex: Number(opt.value),
    rounds: Array(8).fill(null)
  }));

  renderCurrentGameTable();
}

sortAscBtn.onclick = ()=>{ currentSort={key:"total",direction:"asc"}; renderTable(); };
sortDescBtn.onclick = ()=>{ currentSort={key:"total",direction:"desc"}; renderTable(); };

tableHeaders.forEach(th=>{
  th.onclick = ()=>{
    const key = th.dataset.sortKey;
    if (!key) return;
    if (currentSort.key===key)
      currentSort.direction = currentSort.direction==="asc"?"desc":"asc";
    else {
      currentSort.key = key;
      currentSort.direction = "asc";
    }
    renderTable();
  };
});

function exportCsv() {
  let csv = "name,games,total\n";
  players.forEach(p=>{
    const games = p.scores.length;
    const total = p.scores.reduce((s,n)=>s+n,0);
    csv += `"${p.name}",${games},${total}\n`;
  });

  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "quiddler_leaderboard.csv";
  a.click();
}

function importCsvText(text) {
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if (lines.length<=1) return alert("CSV empty.");

  const newPlayers = [];
  for (let i=1;i<lines.length;i++) {
    const [name,games,total] = lines[i].split(",");
    if (!name) continue;

    const g = Number(games);
    const t = Number(total);

    const scores = g>0 ? [t, ...Array(g-1).fill(0)] : [t];
    newPlayers.push({ name:name.replace(/"/g,""), scores });
  }

  if (!confirm("Replace leaderboard with CSV data?")) return;

  players = newPlayers;
  savePlayers();
  currentGame.players=[];
  renderCurrentGameTable();
  renderPlayerSelects();
  renderTable();
}

exportCsvBtn.onclick = exportCsv;
importCsvBtn.onclick = ()=>importCsvInput.click();
importCsvInput.onchange = e=>{
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ()=>importCsvText(reader.result);
  reader.readAsText(file);
};

addPlayerBtn.onclick = addPlayer;
addScoreBtn.onclick = addScore;
removePlayerBtn.onclick = removePlayer;
startGameBtn.onclick = startCurrentGame;

renderPlayerSelects();
renderTable();
renderCurrentGameTable();
</script>

</body>
</html>
